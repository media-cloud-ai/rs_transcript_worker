[package]
name = "transcript_worker"
version = "1.1.0-rc0"
authors = [
    "Marc-Antoine Arnaud <maarnaud@media-io.com>",
    "Nicolas Pierre <nico.pierre@icloud.com>",
]
edition = "2018"
license = "MIT"

[dependencies]
chrono = "0.4.19"
futures = { version = "0.3", features = ["thread-pool"] }
futures-util = "0.3"
native-tls = "0.2.11"
reqwest = { version = "0.10", features = ["json"] }
schemars = "0.8"
serde = "^1.0"
serde_derive = "^1.0"
serde_json = "^1.0"
stainless_ffmpeg = "0.3.10"
tokio = "0.2"
tokio-tls = "0.3"
tokio-tungstenite = { version = "0.10.1", features = [
    "tls",
], git = "https://github.com/media-cloud-ai/tokio-tungstenite.git" }

[dependencies.mcai_worker_sdk]
git = "https://gitlab.com/media-cloud-ai/sdks/rs_mcai_worker_sdk.git"
branch = "hotfix/add-srt-max-payload-size-config"
features = ["media"]

[build-dependencies]
mcai_build = "0.3.0"
